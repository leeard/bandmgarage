name: Deploy to Cloudflare Pages

# Deploys the site when a human pushes to main (content/style edits).
# The daily data refresh deploys itself from fetch-youtube.yml — its commit is
# pushed with GITHUB_TOKEN, which never triggers this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CSS and deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run build
          mkdir -p /tmp/site
          cp index.html youtube.json /tmp/site/
          cp -R dist /tmp/site/dist
          cp -R images /tmp/site/images
          npx --yes wrangler@4 pages deploy /tmp/site --project-name bandmsgarage --branch main --commit-dirty=true
